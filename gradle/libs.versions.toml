[versions]
# Linting
ktlint-gradle           = "12.1.2"
detekt                  = "1.23.8"
compose-rules           = "0.4.22"

# Core
kotlin                  = "2.4.0"
agp                     = "9.2.0"
compose-multiplatform   = "1.11.1"

# Blur
haze                    = "1.7.2"

# Networking + serialization
ktor                    = "3.5.1"
kotlinx-serialization   = "1.11.0"
kotlinx-coroutines      = "1.11.0"

# Persistence
sqldelight              = "2.3.2"

# DI
koin                    = "4.1.1"

# Navigation
voyager                 = "1.1.0-alpha04"

# Image loading
coil3                   = "3.5.0"

# Android
android-minSdk          = "28"
android-targetSdk       = "36"
android-compileSdk      = "36"
androidx-activity       = "1.10.1"
androidx-core           = "1.16.0"
androidx-lifecycle      = "2.9.1"
androidx-security-crypto = "1.1.0-alpha06"
androidx-browser        = "1.8.0"
chucker                 = "4.1.0"

[libraries]
# Ktor
ktor-client-core                  = { module = "io.ktor:ktor-client-core",                  version.ref = "ktor" }
ktor-client-okhttp                = { module = "io.ktor:ktor-client-okhttp",                version.ref = "ktor" }
ktor-client-darwin                = { module = "io.ktor:ktor-client-darwin",                version.ref = "ktor" }
ktor-client-content-negotiation  = { module = "io.ktor:ktor-client-content-negotiation",   version.ref = "ktor" }
ktor-serialization-json          = { module = "io.ktor:ktor-serialization-kotlinx-json",   version.ref = "ktor" }
ktor-client-logging              = { module = "io.ktor:ktor-client-logging",               version.ref = "ktor" }
ktor-client-auth                 = { module = "io.ktor:ktor-client-auth",                  version.ref = "ktor" }

# Kotlinx
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core    = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",    version.ref = "kotlinx-coroutines" }
kotlinx-datetime           = { module = "org.jetbrains.kotlinx:kotlinx-datetime",           version = "0.8.0" }

# SQLDelight
sqldelight-runtime        = { module = "app.cash.sqldelight:runtime",               version.ref = "sqldelight" }
sqldelight-coroutines     = { module = "app.cash.sqldelight:coroutines-extensions",  version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver",        version.ref = "sqldelight" }
sqldelight-native-driver  = { module = "app.cash.sqldelight:native-driver",         version.ref = "sqldelight" }

# Koin
koin-core    = { module = "io.insert-koin:koin-core",             version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android",          version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose-multiplatform", version.ref = "koin" }
koin-test    = { module = "io.insert-koin:koin-test",             version.ref = "koin" }

# Haze
haze                    = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }

# Voyager
voyager-navigator             = { module = "cafe.adriel.voyager:voyager-navigator",              version.ref = "voyager" }
voyager-tab-navigator         = { module = "cafe.adriel.voyager:voyager-tab-navigator",          version.ref = "voyager" }
voyager-bottom-sheet-navigator = { module = "cafe.adriel.voyager:voyager-bottom-sheet-navigator", version.ref = "voyager" }
voyager-koin                  = { module = "cafe.adriel.voyager:voyager-koin",                   version.ref = "voyager" }

# Coil 3
coil3-compose         = { module = "io.coil-kt.coil3:coil-compose",          version.ref = "coil3" }
coil3-network-okhttp  = { module = "io.coil-kt.coil3:coil-network-okhttp",   version.ref = "coil3" }
coil3-network-ktor    = { module = "io.coil-kt.coil3:coil-network-ktor3",    version.ref = "coil3" }

# Android / Compose
compose-activity        = { module = "androidx.activity:activity-compose",         version.ref = "androidx-activity" }
androidx-security-crypto = { module = "androidx.security:security-crypto",          version.ref = "androidx-security-crypto" }
compose-ui-tooling      = { module = "androidx.compose.ui:ui-tooling",             version = "1.8.1" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview",  version = "1.8.1" }
androidx-core-ktx       = { module = "androidx.core:core-ktx",                     version.ref = "androidx-core" }
androidx-browser        = { module = "androidx.browser:browser",                    version.ref = "androidx-browser" }
chucker                 = { module = "com.github.chuckerteam.chucker:library",        version.ref = "chucker" }
chucker-no-op           = { module = "com.github.chuckerteam.chucker:library-no-op",  version.ref = "chucker" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }

# Linting
detekt-compose-rules    = { module = "io.nlopez.compose.rules:detekt",                version.ref = "compose-rules" }

[plugins]
kotlin-multiplatform     = { id = "org.jetbrains.kotlin.multiplatform",       version.ref = "kotlin" }
kotlin-android           = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin" }
kotlin-serialization     = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform    = { id = "org.jetbrains.compose",                     version.ref = "compose-multiplatform" }
compose-compiler         = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
android-application      = { id = "com.android.application",                   version.ref = "agp" }
android-library          = { id = "com.android.library",                       version.ref = "agp" }
sqldelight               = { id = "app.cash.sqldelight",                       version.ref = "sqldelight" }
ktlint                   = { id = "org.jlleitschuh.gradle.ktlint",             version.ref = "ktlint-gradle" }
detekt                   = { id = "io.gitlab.arturbosch.detekt",               version.ref = "detekt" }
