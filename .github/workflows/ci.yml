name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-android:
    name: Lint, static analysis, Android build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # No secrets needed: local.properties is optional at build time — the
      # :shared:generateEsiConfig task (see ADR-016) defaults the client id to
      # "" when the file is absent, which only affects runtime SSO login, not
      # compilation or these unit tests.
      #
      # shared/composeApp use `check` rather than naming their lint/test tasks
      # directly — com.android.kotlin.multiplatform.library (ADR-016) is
      # variant-agnostic, so the old *Debug-suffixed task names (lintDebug,
      # testDebugUnitTest) no longer exist; `check` is the stable Gradle
      # lifecycle task regardless of how the plugin names things underneath.
      # It covers ktlint, detekt, unit tests (Android + iOS), and SQLDelight's
      # migration-schema check for both modules. androidApp is unaffected by
      # that migration (still a plain com.android.application) and keeps its
      # explicit lintDebug.
      - name: ktlint + detekt + Android Lint + unit tests + assembleDebug
        run: |
          ./gradlew \
            ktlintCheck \
            detekt \
            shared:check composeApp:check \
            androidApp:lintDebug \
            androidApp:assembleDebug \
            --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: podforeve-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload test/lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14

  ios-test:
    name: iOS (Kotlin/Native) unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: shared:iosSimulatorArm64Test
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Upload iOS test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: shared/build/test-results/
          retention-days: 14

  # Manual-only (never runs on push/PR — the top-level `workflow_dispatch` trigger is what
  # this `if` restricts to). Needs 5 repo secrets: ANDROID_KEYSTORE_BASE64
  # (`base64 -i androidApp/keystore/podforeve-release.jks`), ANDROID_KEYSTORE_PASSWORD,
  # ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, and ESI_CLIENT_ID (see the dedicated step below
  # for why this one is needed too). See Guide - App Store Launch Readiness P0 #1 and
  # ADR-011's 2026-07-22 addendum for the local keystore.properties this mirrors.
  android-release:
    name: Signed Android release build (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Reconstruct keystore + keystore.properties from secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p androidApp/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > androidApp/keystore/podforeve-release.jks
          cat > keystore.properties <<EOF
          storeFile=androidApp/keystore/podforeve-release.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # A silently-empty ANDROID_KEYSTORE_BASE64 secret (e.g. gh secret set run from
      # the wrong cwd against a relative path) decodes to a 0-byte file with no error
      # here — Gradle only fails much later with a misleading "Tag number over 30 is
      # not supported" from deep inside AGP's bundle-finalize step. Fail fast instead.
      - name: Verify keystore decoded correctly
        run: |
          size=$(wc -c < androidApp/keystore/podforeve-release.jks)
          if [ "$size" -lt 100 ]; then
            echo "::error::Reconstructed keystore is only $size bytes — ANDROID_KEYSTORE_BASE64 secret is likely empty or corrupt."
            exit 1
          fi

      # This job only ever wrote keystore.properties, never local.properties.
      # `:shared:generateEsiConfig` (ADR-011) silently defaults to an empty client_id when
      # local.properties is absent, so the release AAB still built and signed fine, but real
      # EVE SSO login failed at runtime with "The client_id parameter is required." Found
      # 2026-08-09 on the actual Play Store install. ESI_CLIENT_ID is the same public,
      # non-secret OAuth2 PKCE client id from local.properties (ADR-011) — kept as a repo
      # secret anyway per that ADR's own hygiene rule (no plaintext identifiers in committed
      # files; keeps rotation possible), consistent with the 4 keystore secrets above.
      - name: Write local.properties (ESI client ID)
        env:
          ESI_CLIENT_ID: ${{ secrets.ESI_CLIENT_ID }}
        run: |
          if [ -z "$ESI_CLIENT_ID" ]; then
            echo "::error::ESI_CLIENT_ID secret is empty or unset — release build would silently ship with a broken login."
            exit 1
          fi
          echo "esi.client_id=$ESI_CLIENT_ID" >> local.properties

      - name: androidApp:bundleRelease
        run: ./gradlew androidApp:bundleRelease --stacktrace

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: podforeve-release-aab
          path: androidApp/build/outputs/bundle/release/*.aab
          retention-days: 14
